name: Security E2E

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master, dev ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  security-testing:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: 2. Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '18.x'
          cache: 'npm'

      - name: 3. Install NPM Dependencies
        run: npm ci

      - name: 4. Run Security Vulnerability Test Suite
        run: npm run test:security
        env:
          CI: "true"

      - name: 5. Upload Security Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-execution-report
          path: reports/Security_Report.xlsx
          retention-days: 14

      - name: 6. Commit Security Report to Repository
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BRANCH_NAME="${{ github.head_ref }}"
          else
            BRANCH_NAME="${{ github.ref_name }}"
          fi
          echo "Target branch is $BRANCH_NAME"
          
          # Save the generated report
          if [ -f reports/Security_Report.xlsx ]; then
            cp reports/Security_Report.xlsx ../Security_Report.xlsx
          else
            echo "Security_Report.xlsx not found, skipping commit."
            exit 0
          fi
          
          # Retry loop to fetch, checkout branch, restore report, and push
          for i in {1..5}; do
            echo "Attempt $i to sync branch $BRANCH_NAME and push Security report..."
            git reset --hard HEAD
            git fetch origin $BRANCH_NAME
            git checkout $BRANCH_NAME || git checkout -b $BRANCH_NAME origin/$BRANCH_NAME
            git pull origin $BRANCH_NAME
            
            # Restore the report
            mkdir -p reports
            cp ../Security_Report.xlsx reports/Security_Report.xlsx
            
            # Stage it
            git add reports/Security_Report.xlsx
            
            # Check if there are differences to commit
            if git diff --cached --quiet; then
              echo "No changes in Security report. Skipping push."
              exit 0
            else
              git commit -m "Auto-update Security QA Report [skip ci]"
              if git push origin HEAD:$BRANCH_NAME; then
                echo "Successfully pushed Security report!"
                exit 0
              fi
            fi
            echo "Push failed, retrying in 3 seconds..."
            sleep 3
          done
          echo "Failed to commit and push Security report after 5 attempts."
          exit 1
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
