name: Load testing

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master, dev ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  load-testing:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: 2. Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: 3. Run Load Performance QA Test Suite
        run: mvn test -Dtest=LoadTest
        continue-on-error: true # TestNG runs intentional failures, so we don't want the pipeline step to fail completely before reporting.

      - name: 4. Upload Load Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: load-performance-reports
          path: |
            reports/load_report.xlsx
            reports/Load_Test_Report.xlsx
          retention-days: 14

      - name: 5. Commit Load Reports to Repository
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BRANCH_NAME="${{ github.head_ref }}"
          else
            BRANCH_NAME="${{ github.ref_name }}"
          fi
          echo "Target branch is $BRANCH_NAME"
          
          # Save the generated reports
          if [ -f reports/load_report.xlsx ]; then
            cp reports/load_report.xlsx ../load_report.xlsx
            cp reports/Load_Test_Report.xlsx ../Load_Test_Report.xlsx
          else
            echo "Load reports not found, skipping commit."
            exit 0
          fi
          
          # Retry loop to fetch, checkout branch, restore report, and push
          for i in {1..5}; do
            echo "Attempt $i to sync branch $BRANCH_NAME and push Load reports..."
            git reset --hard HEAD
            git fetch origin $BRANCH_NAME
            git checkout $BRANCH_NAME || git checkout -b $BRANCH_NAME origin/$BRANCH_NAME
            git pull origin $BRANCH_NAME
            
            # Restore the reports
            mkdir -p reports
            cp ../load_report.xlsx reports/load_report.xlsx
            cp ../Load_Test_Report.xlsx reports/Load_Test_Report.xlsx
            
            # Stage them
            git add reports/load_report.xlsx reports/Load_Test_Report.xlsx
            
            # Check if there are differences to commit
            if git diff --cached --quiet; then
              echo "No changes in Load reports. Skipping push."
              exit 0
            else
              git commit -m "Auto-update Load QA Reports [skip ci]"
              if git push origin HEAD:$BRANCH_NAME; then
                echo "Successfully pushed Load reports!"
                exit 0
              fi
            fi
            echo "Push failed, retrying in 3 seconds..."
            sleep 3
          done
          echo "Failed to commit and push Load reports after 5 attempts."
          exit 1
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
