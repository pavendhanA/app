name: GateGuard Web Automation CI

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master, dev ]
  workflow_dispatch:

jobs:
  web-automation:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4
        with:
          # Required to push changes back
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: 2. Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '18.x'
          cache: 'npm'

      - name: 3. Install Project Dependencies
        run: npm ci

      - name: 4. Install Playwright Web Browsers
        run: npx playwright install --with-deps

      - name: 5. Execute Web Integration Tests
        run: npm run test:web

      - name: 6. Upload HTML and Excel Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-execution-reports
          path: reports/selenium/
          retention-days: 14

      - name: 7. Commit Reports to Repository
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Stage report directories
          git add reports/selenium/
          
          # Check if there are differences to commit
          if git diff --cached --quiet; then
            echo "No changes in reports. Skipping commit."
          else
            git commit -m "Auto-update Selenium Reports [skip ci]"
            # Force pull before pushing to avoid conflicts
            git pull --rebase origin ${GITHUB_REF##*/}
            git push origin HEAD:${GITHUB_REF##*/}
          fi
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
