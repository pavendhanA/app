name: GateGuard Unified QA E2E CI

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master, dev ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  qa-automation:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: 2. Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '18.x'
          cache: 'npm'

      - name: 3. Install NPM Project Dependencies
        run: npm ci

      - name: 4. Install Playwright Web Browsers
        run: npx playwright install --with-deps

      - name: 5. Execute Selenium/Playwright Web Tests
        run: npm run test:web

      - name: 6. Execute Appium Mobile Tests (Simulated)
        run: npm run test
        env:
          CI: "true"

      - name: 7. Upload Unified Execution Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gateguard-qa-execution-reports
          path: reports/
          retention-days: 14

      - name: 8. Commit Reports to Repository
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Stage report directories
          git add reports/
          
          # Check if there are differences to commit
          if git diff --cached --quiet; then
            echo "No changes in reports. Skipping commit."
          else
            git commit -m "Auto-update QA Reports [skip ci]"
            # Reset hard to clean up local build files
            git reset --hard HEAD
            # Force pull before pushing to avoid conflicts
            git pull --rebase origin ${GITHUB_REF##*/}
            git push origin HEAD:${GITHUB_REF##*/}
          fi
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
