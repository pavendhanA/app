name: GateGuard Unified QA E2E CI

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master, dev ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  qa-automation:
    runs-on: macos-13

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: 2. Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '18.x'
          cache: 'npm'

      - name: 3. Setup Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 4. Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.13'

      - name: 5. Build Android Debug APK
        run: gradle :app:assembleDebug

      - name: 6. Install Appium Server 2.x and Drivers
        run: |
          npm install -g appium@next
          appium driver install uiautomator2
          appium driver install --source=npm appium-flutter-driver
          echo "Appium server and drivers installed successfully."
        shell: bash

      - name: 7. Install NPM Project Dependencies
        run: npm ci

      - name: 8. Install Playwright Web Browsers
        run: npx playwright install --with-deps

      - name: 9. Execute Selenium/Playwright Web Tests
        run: npm run test:web

      - name: 10. Boot Android Emulator & Run Appium Mobile Tests
        uses: reactive-circus/android-emulator-runner@v2
        env:
          AUTOMATION_NAME: UiAutomator2
          APK_PATH: app/build/outputs/apk/debug/app-debug.apk
          APPIUM_HOST: 127.0.0.1
          APPIUM_PORT: 4723
          APPIUM_PATH: /
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -no-audio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            mkdir -p reports/logs
            appium --log reports/logs/appium.log &
            echo "Waiting for Appium port listener to start..."
            for i in {1..30}; do
              if curl -s http://127.0.0.1:4723/status > /dev/null; then
                echo "Appium Server is active!"
                break
              fi
              sleep 2
            done
            npm run test

      - name: 11. Upload Unified Execution Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gateguard-qa-execution-reports
          path: reports/
          retention-days: 14

      - name: 12. Commit Reports to Repository
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Stage report directories
          git add reports/
          
          # Check if there are differences to commit
          if git diff --cached --quiet; then
            echo "No changes in reports. Skipping commit."
          else
            git commit -m "Auto-update QA Reports [skip ci]"
            # Reset hard to clean up emulator files and build configurations
            git reset --hard HEAD
            # Force pull before pushing to avoid conflicts
            git pull --rebase origin ${GITHUB_REF##*/}
            git push origin HEAD:${GITHUB_REF##*/}
          fi
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
